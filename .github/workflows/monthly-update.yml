name: monthly-update

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync device sources into schema.sql
        run: python sync_sources.py

      - name: Rebuild outputs
        run: python build_data.py

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: monthly device catalog sync'
          title: 'Monthly device catalog sync'
          body: |
            Automated monthly sync.

            Sources:
            - AppleDB (`api.appledb.dev/device/main.json.gz`)
            - Google Play certified devices (`androidtrackers/certified-android-devices`)

            New devices are appended to `schema.sql`; existing
            `camera_position_portrait` values are never overwritten.
            See `output/stats.json` for coverage statistics.
          branch: chore/monthly-sync
          delete-branch: true
